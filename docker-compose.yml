# Local Postgres for CineBook.
#   cp .env.example .env   (then set DB_PASSWORD)
#   docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: cinebook-postgres
    environment:
      POSTGRES_DB: cinebook
      POSTGRES_USER: postgres
      # A local throwaway database, so a well-known dev password is fine and
      # removes a setup step. Real credentials only ever exist in Render/Neon.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - cinebook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinebook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cinebook-pgdata:
