# Local Postgres for CineBook.
#   cp .env.example .env   (then set DB_PASSWORD)
#   docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: cinebook-postgres
    environment:
      POSTGRES_DB: cinebook
      POSTGRES_USER: postgres
      # Fails loudly if DB_PASSWORD is not set, rather than starting with a default.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - cinebook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinebook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cinebook-pgdata:
