spring.application.name=cinebook

# Database connection. The password comes from an environment variable, never from git.
spring.datasource.url=jdbc:postgresql://localhost:5432/cinebook
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Mohit@2003}

# Hibernate only checks that entities match the tables. Flyway owns the schema.
spring.jpa.hibernate.ddl-auto=validate
# Stops lazy loading from silently running queries during the web response.
spring.jpa.open-in-view=false
# Prints the SQL JPA runs, which is what you want to see.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8082